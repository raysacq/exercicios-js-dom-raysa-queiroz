<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Questão 04</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 18px;
    }

    .row {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 140px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"] {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: calc(100% - 160px);
    }

    #validar {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    #mensagem {
      margin-top: 14px;
      padding: 10px;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <h1>Validação de Formulário</h1>

  <div>
    <div class="row">
      <label for="nome">Nome completo*</label>
      <input type="text" id="nome" required />
    </div>

    <div class="row">
      <label for="dataNasc">Data de nascimento</label>
      <input type="date" id="dataNasc" />
    </div>

    <div class="row">
      <label for="cpf">CPF*</label>
      <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required />
    </div>

    <div class="row">
      <label for="email">E-mail</label>
      <input type="email" id="email" />
    </div>

    <div class="row">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx" />
    </div>

    <button id="validar" onclick="validarFormulario()">Validar Cadastro</button>

    <p id="mensagem"></p>
  </div>

  <script src="questao04.js"></script>
</body>
</html>
